server:
  port: 8080

spring:
  application:
    name: gorogoro-follow-and-like

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test    # in-memory mode
    # url: jdbc:h2:~/test    # Embedded Mode
    username: ${H2_USERNAME}
    password: ${H2_PASSWORD}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true
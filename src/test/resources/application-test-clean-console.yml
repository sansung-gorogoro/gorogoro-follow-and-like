server:
  port: 8080

spring:
  application:
    name: gorogoro-follow-and-like

  main:
    banner-mode: off

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test    # in-memory mode
    # url: jdbc:h2:~/test    # Embedded Mode
    username: ${H2_USERNAME}
    password: ${H2_PASSWORD}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    properties:
      hibernate:
        format_sql: true
        show_sql: true

logging:
  level:
    root: ERROR            # 전체 로그 최소화
    org.springframework: ERROR
    org.springframework.boot: ERROR
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF   # Hibernate 6
    org.hibernate.type.descriptor.sql: OFF  # 구버전 Hibernate 대비